<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiveMesh Topology Canvas</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #121215;
      --card-inner: #18181d;
      --border: #222227;
      --border-bright: #303038;
      --foreground: #f4f4f5;
      --muted: #71717a;
      --accent: #6366f1;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.9; }
    }
    .status-ring {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-[var(--bg)] text-[var(--foreground)] antialiased min-h-screen flex items-center justify-center font-sans selection:bg-indigo-500/20 p-6">

  <!-- =========================================================================
       PARALLEL EXECUTION CANVAS / OBSERVATORY BOARD
       ========================================================================= -->
  <main class="w-full max-w-6xl mx-auto my-auto">
    <div class="border border-[var(--border)] rounded-2xl bg-[var(--card)] p-8 relative shadow-2xl min-h-[460px] flex flex-col justify-center">
      
      <!-- Topology Body -->
      <div id="topology-area" class="w-full my-auto">
        
        <!-- Empty State (When no swarm is currently active) -->
        <div id="empty-state" class="text-center py-12 space-y-4">
          <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-3xl mx-auto shadow-inner">
            👑
          </div>
          <div class="text-base font-semibold text-[var(--foreground)] tracking-tight">Orchestrator Standing By</div>
          <p class="text-xs text-[var(--muted)] font-mono max-w-md mx-auto leading-relaxed">
            Give a task to the HiveMesh agent in your chat or terminal. The Orchestrator will compute the critical path, allocate isolated Git worktrees, and display active parallel agents here in real time.
          </p>
        </div>

        <!-- Dynamic Agents Grid (Shown when swarm is active) -->
        <div id="agents-grid" class="hidden space-y-6">
          
          <!-- Master Orchestrator Card -->
          <div class="max-w-sm mx-auto p-4 rounded-xl bg-gradient-to-br from-indigo-950/40 to-purple-950/20 border border-indigo-500/40 text-center shadow-lg relative">
            <span class="absolute -top-2.5 left-1/2 -translate-x-1/2 text-[10px] font-mono bg-indigo-600 text-white px-3 py-0.5 rounded-full font-bold uppercase tracking-wider shadow">
              Master Orchestrator
            </span>
            <div class="text-xs font-bold text-indigo-300 mt-1" id="orch-task-summary">Coordinating Swarm</div>
            <div class="text-[11px] font-mono text-zinc-400 mt-0.5" id="orch-plan-count">Parallel Agents Deployed</div>
          </div>

          <!-- Connecting Vertical Line -->
          <div class="w-full flex justify-center">
            <div class="h-6 w-[2px] bg-gradient-to-b from-indigo-500 to-transparent"></div>
          </div>

          <!-- Parallel Agent Cards Container -->
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="cards-container">
            <!-- Dynamically populated from /api/status -->
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- =========================================================================
       REAL-TIME SSE STREAMING & CANVAS LOGIC
       ========================================================================= -->
  <script>
    let activeSwarm = null;
    let currentPlan = {};

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        currentPlan = data.plan || {};

        if (data.swarms && data.swarms.length > 0) {
          activeSwarm = data.swarms[0];
          renderActiveSwarm(activeSwarm, currentPlan);
        } else {
          activeSwarm = null;
          renderEmptyState();
        }
      } catch (err) {
        console.error("Failed to fetch status:", err);
      }
    }

    function renderEmptyState() {
      const emptyEl = document.getElementById('empty-state');
      const gridEl = document.getElementById('agents-grid');
      if (emptyEl) emptyEl.classList.remove('hidden');
      if (gridEl) gridEl.classList.add('hidden');
    }

    function renderActiveSwarm(swarm, plan) {
      const emptyEl = document.getElementById('empty-state');
      const gridEl = document.getElementById('agents-grid');
      if (emptyEl) emptyEl.classList.add('hidden');
      if (gridEl) gridEl.classList.remove('hidden');

      const orchSummary = document.getElementById('orch-task-summary');
      if (orchSummary) {
        orchSummary.innerText = `Active Swarm: ${swarm.id}`;
      }

      const orchCount = document.getElementById('orch-plan-count');
      if (orchCount) {
        orchCount.innerText = `${swarm.worktrees.length} Parallel Agents Deployed`;
      }

      const colors = ["#3b82f6", "#a855f7", "#10b981", "#f43f5e", "#f59e0b", "#06b6d4"];
      const container = document.getElementById('cards-container');
      if (!container) return;

      container.innerHTML = swarm.worktrees.map((wt, idx) => {
        const color = colors[idx % colors.length];
        const taskText = plan[wt.role] || "Executing domain responsibilities in isolated worktree";

        return `
          <div class="p-4 rounded-xl bg-[var(--card-inner)] border border-[var(--border)] hover:border-[var(--border-bright)] transition shadow-md space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-bold text-xs uppercase tracking-wider font-mono" style="color: ${color};">${escapeHtml(wt.role)}</span>
              <span class="text-[9px] font-mono text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded font-semibold">${escapeHtml(wt.status)}</span>
            </div>
            <p class="text-[11px] text-zinc-300 leading-relaxed font-mono line-clamp-3">${escapeHtml(taskText)}</p>
            <div class="pt-2 border-t border-[var(--border)] space-y-1 text-[10px] font-mono text-[var(--muted)]">
              <div class="truncate text-zinc-400" title="${escapeHtml(wt.branch)}">🌿 ${escapeHtml(wt.branch)}</div>
              <div class="truncate text-zinc-500" title="${escapeHtml(wt.path)}">📁 ${escapeHtml(wt.path)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function initSSE() {
      if (window.location.protocol.startsWith('http')) {
        const evt = new EventSource('/events');
        evt.addEventListener('swarm_created', () => fetchStatus());
        evt.addEventListener('swarm_cleaned', () => fetchStatus());
        evt.addEventListener('agent_steered', () => fetchStatus());
        evt.addEventListener('orchestrator_thinking', () => fetchStatus());
      }
    }

    fetchStatus();
    initSSE();
  </script>
</body>
</html>
