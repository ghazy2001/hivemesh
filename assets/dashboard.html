<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiveMesh Mission Control</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #121215;
      --card-inner: #18181c;
      --border: #222226;
      --border-bright: #303038;
      --foreground: #f4f4f5;
      --muted: #71717a;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="emerald"] {
      --bg: #030705;
      --card: #09120c;
      --card-inner: #0f1c14;
      --border: #14281c;
      --border-bright: #1f3d2b;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.15);
    }

    [data-theme="oled"] {
      --bg: #000000;
      --card: #080808;
      --card-inner: #101010;
      --border: #1a1a1a;
      --border-bright: #262626;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    .status-dot {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-[var(--bg)] text-[var(--foreground)] antialiased min-h-screen p-4 md:p-8 font-sans selection:bg-indigo-500/20 transition-colors duration-200">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- =======================================================================
         1. CLEAN HEADER BAR
         ======================================================================= -->
    <header class="flex items-center justify-between pb-4 border-b border-[var(--border)]">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500/20 to-purple-500/10 border border-[var(--border-bright)] flex items-center justify-center text-lg shadow-sm">
          🐝
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-base font-semibold tracking-tight text-[var(--foreground)]">HiveMesh</h1>
            <span class="text-[11px] px-2 py-0.5 rounded-full bg-[var(--card)] text-zinc-400 border border-[var(--border)] font-mono">v0.3.0</span>
          </div>
          <div class="flex items-center space-x-2 text-xs font-mono text-[var(--muted)] mt-0.5">
            <span id="proj-name">Loading project...</span>
            <span>•</span>
            <span class="text-indigo-400 font-medium" id="proj-branch">main</span>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Live SSE Indicator -->
        <div class="flex items-center space-x-1.5 text-xs font-mono px-2.5 py-1 rounded-full bg-[var(--card)] border border-[var(--border)] text-zinc-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 status-dot" id="live-dot"></span>
          <span id="live-status">Connected</span>
        </div>

        <!-- Minimal Palette -->
        <div class="flex items-center bg-[var(--card)] border border-[var(--border)] rounded-lg p-1 space-x-1">
          <button onclick="changeTheme('default')" title="Indigo" class="w-3.5 h-3.5 rounded-full bg-indigo-500 hover:ring-2 ring-indigo-400 transition"></button>
          <button onclick="changeTheme('emerald')" title="Emerald" class="w-3.5 h-3.5 rounded-full bg-emerald-500 hover:ring-2 ring-emerald-400 transition"></button>
          <button onclick="changeTheme('oled')" title="OLED Cyan" class="w-3.5 h-3.5 rounded-full bg-sky-400 hover:ring-2 ring-sky-300 transition"></button>
        </div>

        <button onclick="fetchStatus()" class="text-xs font-mono px-3 py-1.5 rounded-lg bg-[var(--card)] hover:bg-[var(--card-inner)] border border-[var(--border)] text-zinc-300 transition active:scale-95">
          Refresh
        </button>
      </div>
    </header>

    <!-- =======================================================================
         2. REAL METRICS STRIP
         ======================================================================= -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="p-3.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
        <span class="text-[11px] font-mono text-[var(--muted)] block">Active Swarms</span>
        <div class="text-xl font-bold mt-1 text-[var(--foreground)]" id="metric-swarms">0</div>
      </div>

      <div class="p-3.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
        <span class="text-[11px] font-mono text-[var(--muted)] block">Isolated Worktrees</span>
        <div class="text-xl font-bold mt-1 text-emerald-400" id="metric-worktrees">0</div>
      </div>

      <div class="p-3.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
        <span class="text-[11px] font-mono text-[var(--muted)] block">Blackboard Insights</span>
        <div class="text-xl font-bold mt-1 text-indigo-400" id="metric-insights">0</div>
      </div>

      <div class="p-3.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
        <span class="text-[11px] font-mono text-[var(--muted)] block">Git Commit (HEAD)</span>
        <div class="text-xl font-bold mt-1 text-zinc-300 font-mono" id="metric-commits">-</div>
      </div>
    </div>

    <!-- =======================================================================
         3. SECTION: ACTIVE SWARMS & WORKTREES (100% REAL)
         ======================================================================= -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-mono uppercase tracking-wider text-[var(--muted)] font-semibold">Active Parallel Swarms</h2>
        <button onclick="toggleNewSwarmModal()" class="text-xs font-mono text-indigo-400 hover:text-indigo-300 transition flex items-center gap-1">
          + Launch New Swarm
        </button>
      </div>

      <!-- Quick Launch Drawer / Panel -->
      <div id="new-swarm-box" class="hidden p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-3">
        <div class="text-xs font-semibold text-[var(--foreground)]">Launch a New Parallel Swarm</div>
        <div class="space-y-2 text-xs font-mono">
          <div>
            <label class="text-[11px] text-[var(--muted)] block mb-1">Task Description</label>
            <input type="text" id="swarm-task-input" placeholder="e.g. Implement OAuth token refresh with passkeys"
              class="w-full px-3 py-2 rounded-lg bg-[var(--card-inner)] border border-[var(--border)] text-[var(--foreground)] focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="text-[11px] text-[var(--muted)] block mb-1">Roles (comma-separated)</label>
            <input type="text" id="swarm-roles-input" value="backend, frontend, security"
              class="w-full px-3 py-2 rounded-lg bg-[var(--card-inner)] border border-[var(--border)] text-[var(--foreground)] focus:outline-none focus:border-indigo-500">
          </div>
        </div>
        <div class="flex justify-end space-x-2 pt-1">
          <button onclick="toggleNewSwarmModal()" class="text-xs font-mono px-3 py-1.5 rounded-lg border border-[var(--border)] hover:bg-[var(--card-inner)] text-[var(--muted)]">Cancel</button>
          <button onclick="launchRealSwarm()" class="text-xs font-mono px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Create Swarm & Worktrees</button>
        </div>
      </div>

      <!-- Swarms Container (populated from /api/status) -->
      <div id="swarms-container" class="space-y-3">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- =======================================================================
         4. SECTION: BLACKBOARD KNOWLEDGE (FTS5) (100% REAL)
         ======================================================================= -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-mono uppercase tracking-wider text-[var(--muted)] font-semibold">Shared Blackboard Memory (SQLite FTS5)</h2>
        <span class="text-[11px] font-mono text-zinc-500">Zero-Token Discovery Bus</span>
      </div>

      <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-3">
        <div class="flex items-center gap-2">
          <input type="text" id="bb-filter" oninput="filterBlackboard()" placeholder="Filter memory (FTS5 BM25)..."
            class="flex-1 text-xs px-3 py-1.5 rounded-lg bg-[var(--card-inner)] border border-[var(--border)] text-[var(--foreground)] placeholder-[var(--muted)] font-mono focus:outline-none focus:border-indigo-500">
          
          <button onclick="toggleAddInsight()" class="text-xs font-mono px-2.5 py-1.5 rounded-lg bg-[var(--card-inner)] border border-[var(--border)] hover:bg-[var(--border)] text-zinc-300">
            + Post Insight
          </button>
        </div>

        <!-- Add Insight Form -->
        <div id="add-insight-box" class="hidden p-3 rounded-lg bg-[var(--card-inner)] border border-[var(--border)] space-y-2 text-xs font-mono">
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="insight-topic" placeholder="Topic (e.g. auth:jwt)" class="px-2.5 py-1.5 rounded bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)]">
            <input type="text" id="insight-key" placeholder="Key (e.g. session_ttl)" class="px-2.5 py-1.5 rounded bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)]">
          </div>
          <input type="text" id="insight-value" placeholder="Insight value or architecture discovery..." class="w-full px-2.5 py-1.5 rounded bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)]">
          <div class="flex justify-end gap-2 pt-1">
            <button onclick="toggleAddInsight()" class="text-[11px] px-2 py-1 rounded text-zinc-400">Cancel</button>
            <button onclick="postRealInsight()" class="text-[11px] px-3 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Post to SQLite</button>
          </div>
        </div>

        <!-- Blackboard Items List -->
        <div id="blackboard-list" class="space-y-2 text-xs font-mono">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>

    <!-- =======================================================================
         5. SECTION: REAL EVENT LOG STREAM
         ======================================================================= -->
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs font-mono text-[var(--muted)]">
        <span class="uppercase tracking-wider font-semibold">Live System Events</span>
        <button onclick="clearLogs()" class="hover:text-[var(--foreground)] transition">Clear</button>
      </div>

      <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] font-mono text-[11px] h-36 overflow-y-auto space-y-1 text-zinc-300" id="live-log-box">
        <!-- Real events stream here -->
      </div>
    </div>

  </div>

  <!-- =========================================================================
       JAVASCRIPT: 100% REAL DATA LOGIC & SSE
       ========================================================================= -->
  <script>
    // Theme Management
    function changeTheme(theme) {
      if (theme === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      localStorage.setItem('hivemesh-theme', theme);
    }
    const savedTheme = localStorage.getItem('hivemesh-theme');
    if (savedTheme) changeTheme(savedTheme);

    let currentSwarms = [];
    let currentBlackboard = [];

    function addLog(source, message, color = "#9ca3af") {
      const box = document.getElementById('live-log-box');
      const time = new Date().toLocaleTimeString('en-US', { hour12: false });
      const row = document.createElement('div');
      row.className = "flex items-start space-x-2";
      row.innerHTML = `
        <span class="text-zinc-500 shrink-0">${time}</span>
        <span class="shrink-0 font-semibold" style="color: ${color};">[${source}]</span>
        <span class="break-all">${escapeHtml(message)}</span>
      `;
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('live-log-box').innerHTML = '';
      addLog("SYSTEM", "Log buffer cleared", "#10b981");
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Fetch 100% Real Status
    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        // 1. Project Info
        document.getElementById('proj-name').innerText = data.project.name;
        document.getElementById('proj-branch').innerText = data.project.branch;
        document.getElementById('metric-commits').innerText = data.project.commit ? '#' + data.project.commit : '-';

        // 2. Metrics
        currentSwarms = data.swarms || [];
        document.getElementById('metric-swarms').innerText = currentSwarms.length;
        document.getElementById('metric-worktrees').innerText = data.totalWorktrees || 0;

        currentBlackboard = (data.blackboard && data.blackboard.entries) || [];
        document.getElementById('metric-insights').innerText = currentBlackboard.length;

        // 3. Render Swarms
        renderSwarms(currentSwarms);

        // 4. Render Blackboard
        renderBlackboard(currentBlackboard);

      } catch (err) {
        addLog("ERROR", "Failed to fetch status: " + err.message, "#f43f5e");
      }
    }

    // Render Swarms
    function renderSwarms(swarms) {
      const container = document.getElementById('swarms-container');
      if (swarms.length === 0) {
        container.innerHTML = `
          <div class="p-6 rounded-xl bg-[var(--card)] border border-[var(--border)] text-center space-y-2">
            <div class="text-2xl">🐝</div>
            <div class="text-xs font-semibold text-[var(--foreground)]">No active swarms</div>
            <p class="text-xs text-[var(--muted)] font-mono max-w-sm mx-auto">
              No isolated worktrees are currently active. Run <code class="text-indigo-400">npx hivemesh run "&lt;task&gt;"</code> or click "+ Launch New Swarm" above.
            </p>
          </div>
        `;
        return;
      }

      container.innerHTML = swarms.map(s => {
        const date = new Date(s.createdAt).toLocaleTimeString();
        return `
          <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-3">
            <div class="flex items-center justify-between pb-2 border-b border-[var(--border)] text-xs font-mono">
              <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span class="font-bold text-[var(--foreground)]">${escapeHtml(s.id)}</span>
                <span class="text-zinc-500">created at ${date}</span>
              </div>
              <button onclick="cleanRealSwarm('${escapeHtml(s.id)}')" class="text-rose-400 hover:text-rose-300 font-mono transition text-[11px] px-2 py-0.5 rounded bg-rose-500/10 border border-rose-500/20">
                Destroy Worktrees
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
              ${s.worktrees.map(wt => `
                <div class="p-2.5 rounded-lg bg-[var(--card-inner)] border border-[var(--border)] text-xs font-mono space-y-1">
                  <div class="flex items-center justify-between">
                    <span class="font-bold text-indigo-400 uppercase text-[11px]">${escapeHtml(wt.role)}</span>
                    <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-1.5 py-0.2 rounded">${escapeHtml(wt.status)}</span>
                  </div>
                  <div class="text-[11px] text-zinc-300 truncate" title="${escapeHtml(wt.branch)}">🌿 ${escapeHtml(wt.branch)}</div>
                  <div class="text-[10px] text-zinc-500 truncate" title="${escapeHtml(wt.path)}">📁 ${escapeHtml(wt.path)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // Render Blackboard
    function renderBlackboard(entries) {
      const list = document.getElementById('blackboard-list');
      if (entries.length === 0) {
        list.innerHTML = `
          <div class="p-4 text-center text-xs text-[var(--muted)] font-mono">
            No knowledge entries posted yet. Parallel agents will automatically index architectural patterns here.
          </div>
        `;
        return;
      }

      list.innerHTML = entries.map(e => `
        <div class="p-2.5 rounded-lg bg-[var(--card-inner)] border border-[var(--border)] flex justify-between items-start">
          <div class="space-y-0.5">
            <div class="flex items-center space-x-2">
              <span class="text-indigo-400 font-bold text-[11px]">[${escapeHtml(e.topic)}]</span>
              <span class="text-zinc-400 text-[11px] font-semibold">${escapeHtml(e.key)}</span>
            </div>
            <p class="text-zinc-200 text-xs">${escapeHtml(e.value)}</p>
          </div>
          <span class="text-[10px] text-zinc-500 shrink-0 ml-2 font-mono">${escapeHtml(e.agentId)}</span>
        </div>
      `).join('');
    }

    function filterBlackboard() {
      const q = document.getElementById('bb-filter').value.toLowerCase();
      const filtered = currentBlackboard.filter(e => 
        e.topic.toLowerCase().includes(q) || 
        e.key.toLowerCase().includes(q) || 
        e.value.toLowerCase().includes(q)
      );
      renderBlackboard(filtered);
    }

    function toggleNewSwarmModal() {
      const el = document.getElementById('new-swarm-box');
      el.classList.toggle('hidden');
    }

    function toggleAddInsight() {
      const el = document.getElementById('add-insight-box');
      el.classList.toggle('hidden');
    }

    // Real API Calls
    async function launchRealSwarm() {
      const task = document.getElementById('swarm-task-input').value.trim();
      const rolesInput = document.getElementById('swarm-roles-input').value.trim();
      const roles = rolesInput ? rolesInput.split(',').map(r => r.trim()).filter(Boolean) : [];

      if (!task) {
        alert("Please enter a task description");
        return;
      }

      addLog("SWARM", `Creating parallel swarm with roles: ${roles.join(', ')}...`, "#6366f1");
      toggleNewSwarmModal();

      try {
        const res = await fetch('/api/swarm/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task, roles })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        addLog("SWARM", `Swarm created successfully: ${data.swarm.id} (${data.swarm.worktrees.length} isolated worktrees)`, "#10b981");
        fetchStatus();
      } catch (err) {
        addLog("ERROR", "Failed to launch swarm: " + err.message, "#f43f5e");
      }
    }

    async function cleanRealSwarm(swarmId) {
      if (!confirm(`Are you sure you want to clean worktrees for ${swarmId}?`)) return;
      addLog("SWARM", `Destroying worktrees for swarm ${swarmId}...`, "#f43f5e");

      try {
        const res = await fetch('/api/swarm/clean', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ swarmId })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        addLog("SWARM", `Worktrees destroyed for ${swarmId}`, "#10b981");
        fetchStatus();
      } catch (err) {
        addLog("ERROR", "Failed to clean swarm: " + err.message, "#f43f5e");
      }
    }

    async function postRealInsight() {
      const topic = document.getElementById('insight-topic').value.trim();
      const key = document.getElementById('insight-key').value.trim();
      const value = document.getElementById('insight-value').value.trim();

      if (!topic || !key || !value) {
        alert("Please fill all insight fields");
        return;
      }

      try {
        const res = await fetch('/api/blackboard/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic, key, value, agentId: "operator" })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        addLog("BLACKBOARD", `Indexed real insight [${topic}]: ${key}`, "#10b981");
        document.getElementById('insight-topic').value = '';
        document.getElementById('insight-key').value = '';
        document.getElementById('insight-value').value = '';
        toggleAddInsight();
        fetchStatus();
      } catch (err) {
        addLog("ERROR", "Failed to post insight: " + err.message, "#f43f5e");
      }
    }

    // Connect to SSE
    function initSSE() {
      if (window.location.protocol.startsWith('http')) {
        const evt = new EventSource('/events');
        evt.onopen = () => {
          document.getElementById('live-status').innerText = 'Connected';
          document.getElementById('live-dot').className = 'w-2 h-2 rounded-full bg-emerald-400 status-dot';
          addLog("ENGINE", "Connected to HiveMesh SSE Event Bus", "#10b981");
        };
        evt.onerror = () => {
          document.getElementById('live-status').innerText = 'Offline';
          document.getElementById('live-dot').className = 'w-2 h-2 rounded-full bg-rose-500';
        };
        evt.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.message) addLog("ENGINE", data.message, "#38bdf8");
          } catch {}
        };
        evt.addEventListener('swarm_created', () => { fetchStatus(); });
        evt.addEventListener('swarm_cleaned', () => { fetchStatus(); });
        evt.addEventListener('blackboard_posted', () => { fetchStatus(); });
      }
    }

    // Startup
    fetchStatus();
    initSSE();
  </script>
</body>
</html>
